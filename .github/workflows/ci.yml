name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic check backend
        run: python3 -m pip install --quiet sympy==1.14.0

      - name: Run offline test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Codex skills
        run: python3 scripts/validate-skills.py

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"
